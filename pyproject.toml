[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "financeflow-core"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["fastapi==0.141.1", "uvicorn==0.52.1", "pydantic==2.13.4", "pycountry==24.6.1"]
[project.optional-dependencies]
test = ["httpx==0.28.1", "xlwt==1.3.0"]
sse-margin = ["xlrd==2.0.2"]
[tool.setuptools.packages.find]
where = ["packages/core/src"]
