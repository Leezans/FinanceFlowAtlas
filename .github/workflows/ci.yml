name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Untrusted PR code runs only on disposable GitHub-hosted runners.
# Never replace pull_request with pull_request_target here.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  TZ: UTC
  NEXT_TELEMETRY_DISABLED: "1"
  WRANGLER_SEND_METRICS: "false"
  CLOUDFLARE_CF_FETCH_ENABLED: "false"

defaults:
  run:
    shell: bash

jobs:
  site:
    name: Site tests, lint, types and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --include=dev --include=optional --no-audit --no-fund
      - name: Synthetic unit and component tests
        run: npm test -- --maxWorkers=2 --minWorkers=1
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: node node_modules/typescript/bin/tsc --noEmit
      - name: Offline build regressions
        run: npm run test:build-assets
      - name: Production build and asset verification
        run: npm run build

  web:
    name: Web tests, types and build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --include=dev --include=optional --no-audit --no-fund
      - name: Synthetic unit and component tests
        run: npm test -- --maxWorkers=2 --minWorkers=1
      - name: Typecheck and build
        run: npm run build

  python:
    name: Python synthetic API and adapter tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install core, test and optional SSE XLS dependencies
        run: python -m pip install --disable-pip-version-check --no-input ".[test,sse-margin]"
      - name: Require XLS test dependencies (do not silently skip decoder coverage)
        run: python -c "import xlrd, xlwt"
      - name: Synthetic core and in-process API tests
        run: python -m unittest discover -s tests -v
      - name: Synthetic AKShare normalization tests
        env:
          PYTHONPATH: packages/akshare-adapter/src
        run: python -m unittest discover -s packages/akshare-adapter/tests -v

